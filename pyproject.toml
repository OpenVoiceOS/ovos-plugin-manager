[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-plugin-manager"
dynamic = ["version"]
description = "OpenVoiceOS plugin manager"
readme = "README.md"
license = "Apache-2.0"
authors = [{name = "jarbasAi", email = "jarbas@openvoiceos.com"}]
requires-python = ">=3.10"
dependencies = [
    "ovos-utils>=0.2.1,<1.0.0",
    "ovos_bus_client>=0.0.8,<3.0.0",
    "ovos-config>=0.0.12,<4.0.0",
    "combo_lock~=0.3",
    "requests~=2.32",
    "quebra_frases",
    "ovos-spec-tools[langcodes]>=1.6.1a1",
    "setuptools; python_version>='3.12'",
    "standard-aifc; python_version>='3.13'",
    "audioop-lts; python_version>='3.13'",
    "pydantic~=2.0",
]

[project.urls]
Homepage = "https://github.com/OpenVoiceOS/OVOS-plugin-manager"
Repository = "https://github.com/OpenVoiceOS/OVOS-plugin-manager"

[project.optional-dependencies]
# mediavocab is only needed by MediaProvider plugins (the routing primitives and
# Release/Signals types); opm itself imports it lazily, so it ships as an extra.
media = ["mediavocab>=1.0.0"]
test = [
    "pytest",
    "pytest-cov",
    "python-vlc",
    "ovos-hardware-helpers>=1.0.0",
    "mediavocab>=1.0.0"
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["ovos_plugin_manager*"]

[tool.setuptools.dynamic]
version = {attr = "ovos_plugin_manager.version.__version__"}
